<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="../assets/css/window-inside.css">
</head>
<body class="inside-page">
<main class="inside inside-journey"><div id="inside-panels"><div class="inside-sticky">
  <section class="inside-study is-active"><div class="inside-panel" id="panel-hardware" data-part="hardware" data-mode="closed"><div class="inside-scene"></div><div class="inside-controls"></div><div class="inside-legend"></div><p class="inside-status"></p></div></section>
  <section class="inside-study"><div class="inside-panel" id="panel-glass" data-part="glass" data-mode="closed"><div class="inside-scene"></div><div class="inside-controls"></div><div class="inside-legend"></div><p class="inside-status"></p></div></section>
  <section class="inside-study"><div class="inside-panel" id="panel-profile" data-part="profile" data-mode="closed"><div class="inside-scene"></div><div class="inside-controls"></div><div class="inside-legend"></div><p class="inside-status"></p></div></section>
  <section class="inside-study"><div class="inside-panel" id="panel-frame" data-part="frame" data-mode="closed"><div class="inside-scene"></div><div class="inside-controls"></div><div class="inside-legend"></div><p class="inside-status"></p></div></section>
</div></div></main>
<script type="module">
import {createInsideExhibit} from '../assets/js/window-inside-3d.js';
const host=document.querySelector('#inside-panels');
host.querySelectorAll('.inside-controls').forEach(controls=>{controls.innerHTML='<button type="button" data-detail data-on="Собрать" data-off="Разобрать"></button><button type="button" data-mode="closed"></button><button type="button" data-mode="open"></button><button type="button" data-mode="tilt"></button>';});
const exhibit=createInsideExhibit(host);
window.recordScene=(scene,duration=6000)=>new Promise((resolve,reject)=>{
  const panel=document.querySelector(`#panel-${scene}`);
  exhibit.update(panel);
  exhibit.scroll(panel,0);
  const canvas=panel.querySelector('canvas');
  const stream=canvas.captureStream(30);
  const chunks=[];
  const recorder=new MediaRecorder(stream,{mimeType:'video/webm;codecs=vp8',videoBitsPerSecond:5000000});
  recorder.ondataavailable=event=>{if(event.data.size)chunks.push(event.data);};
  recorder.onerror=reject;
  recorder.onstop=()=>{
    stream.getTracks().forEach(track=>track.stop());
    const blob=new Blob(chunks,{type:'video/webm'});
    const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob);
  };
  const start=performance.now();
  recorder.start(250);
  const timer=setInterval(()=>{
    const progress=Math.min(1,(performance.now()-start)/duration);
    exhibit.scroll(panel,progress);
    if(progress===1){clearInterval(timer);recorder.stop();}
  },1000/20);
});
window.recorderReady=true;
</script>
</body>
</html>
